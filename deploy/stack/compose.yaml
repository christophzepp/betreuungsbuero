# Dockge-Stack: Betreuungsbüro-Dokumentenassistent (Blanko-Start).
# Erststart: leere Datenbank -> die Oberfläche führt nach /setup (Admin-Konto anlegen,
# SETUP_TOKEN aus der .env wird dort abgefragt - Pflicht, weil der Server über Cloudflare
# im Internet steht).
services:
  betreuungsbuero:
    build: ./app
    container_name: betreuungsbuero
    restart: unless-stopped
    env_file: .env
    ports:
      # Fürs Büro-LAN (und für große Importe/Sicherungen OHNE Cloudflare, siehe README).
      - "8935:8935"
    volumes:
      # ALLE Daten (Datenbank, Dokumentenspeicher, Sicherungsstände) leben hier -
      # ein Ordner neben der compose.yaml, damit er bei Host-Backups sichtbar mitläuft.
      - ./daten/runtime:/app/runtime
    # Läuft cloudflared als Container in einem eigenen Stack, beide an ein gemeinsames
    # Netz hängen und im Tunnel "http://betreuungsbuero:8935" als Ziel eintragen:
    # networks: [tunnel]
# networks:
#   tunnel:
#     external: true

# Fester eigener Adressbereich (25.08.2026): Der Server hat >30 Container-Netze, die
# vordefinierten Docker-Adresspools sind damit erschoepft ("all predefined address pools
# have been fully subnetted"). Ein AUSDRUECKLICH gesetztes Subnetz umgeht den Topf ganz -
# ohne Docker-Neustart und ohne fremde Stacks anzufassen.
# 10.87.42.x liegt bewusst weit weg vom Buero-LAN (192.168.178.0/24). WICHTIG: Dockers
# Standardpools enthalten auch 192.168.0.0/16 - ein automatisch vergebenes Netz koennte
# dort mit dem eigenen LAN kollidieren. Deshalb hier explizit.
networks:
  default:
    ipam:
      config:
        - subnet: 10.87.42.0/24
