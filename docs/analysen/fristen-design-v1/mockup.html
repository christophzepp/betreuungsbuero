  const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}})};
  const today='2026-09-10', dayMs=86400000;
  const parse=d=>d?new Date(d+'T12:00:00'):null;

  const intervalOptions=[['','Einmalig'],['weekly','Wöchentlich'],['biweekly','14-tägig'],['monthly','Monatlich'],['quarterly','Vierteljährlich'],['halfyear','Halbjährlich'],['yearly','Jährlich']];
  const categories=[['widerspruch','Widerspruch / Rechtsmittel'],['antrag','Antrag / Klage'],['anfangsbericht','Anfangs-/Erstbericht'],['vermoegensverzeichnis','Vermögensverzeichnis'],['jahresbericht','Jahresbericht'],['rechnungslegung','Rechnungslegung'],['verguetung','Vergütung / Abrechnung'],['ueberpruefung','Überprüfung / Verlängerung'],['genehmigung','Betreuungsgerichtliche Genehmigung'],['behoerde','Behörde / Sozialleistung'],['gesundheit','Gesundheit / Reha / Pflege'],['steuer','Steuer / Finanzamt'],['wiedervorlage','Wiedervorlage / interne Prüfung'],['sonstige','Sonstige Frist']];

    {...blank,id:'f3',caseId:'c2',title:'Mitwirkung: Unterlagen nachreichen',category:'behoerde',institution:'Jobcenter Musterstadt',dueDate:'2026-09-14',baseDate:'2026-08-15',remindDays:3,priority:'high',note:'Aktuelle Kontoauszüge und Mietbescheinigung einreichen.'},

    {...blank,id:'f5',caseId:'c3',title:'Ratenvereinbarung bestätigen',institution:'Stadtwerke Musterstadt',category:'sonstige',dueDate:'2026-09-30',source:'debt',note:'Verknüpft mit der Forderung der Stadtwerke. Fälligkeit und Inhalt werden in der Schuldenregulierung gepflegt.'},

    {...blank,id:'f9',title:'Termin für Hilfeplangespräch abstimmen',category:'wiedervorlage',institution:'Sozialamt Landkreis Muster',routing:'none',note:'Termin steht noch nicht fest. Rückmeldung der Wohngruppe abwarten.'},

    {...blank,id:'d2',caseId:'c2',title:'Jahresbericht',category:'jahresbericht',institution:'Amtsgericht Musterstadt',dueDate:'2026-10-05',interval:'yearly',remindDays:30,kind:'derived',routing:'none',source:'derived',note:'Aus dem Betreuungsbeginn abgeleitet. Den konkreten Termin aus dem Gerichtsschreiben vor der Übernahme prüfen.'}
  ];

  const design={density:'comfortable',detail:'side',appearance:'auto',width:'auto'};
  const caseOptions=()=>[['self','Dieser Fall · '+label(cases,state.activeCase)],['all','Alle Fälle'],...cases];

  const sourceText=x=>x.kind==='derived'?'Gesetzlich abgeleitet':({manual:'Von Hand erfasst',inbox:'Posteingang',ki:'Dokumentenerkennung',debt:'Schuldenregulierung',derived:'Übernommener Vorschlag',goal:'Wünsche und Bedarfe'}[x.source]||'Eigene Frist');
  const hasCal=x=>['both','calendar'].includes(x.routing),hasTodo=x=>['both','todo'].includes(x.routing);
  const route=(cal,todo)=>cal&&todo?'both':cal?'calendar':todo?'todo':'none';
  const current=()=>items.find(x=>x.id===state.selected);
  function matches(x,f=state){
    if(f.scope==='self'&&x.caseId!==state.activeCase)return false;
    if(!['self','all'].includes(f.scope)&&x.caseId!==f.scope)return false;
    if(f.status!=='all'&&x.status!==f.status)return false;
    if(f.category!=='all'&&x.category!==f.category||f.priority!=='all'&&x.priority!==f.priority)return false;
    if(f.source==='own'&&x.kind!=='own'||f.source==='derived'&&x.kind!=='derived'||f.source==='debt'&&x.source!=='debt'||f.source==='ki'&&x.source!=='ki')return false;

    if(f.due==='overdue'&&(n===null||n>=0||x.status==='done'))return false;

    if(f.due==='month'&&(!x.dueDate||x.dueDate<today||x.dueDate>'2026-09-30'))return false;

      case 'apply-filter':for(const k of ['scope','due','category','source','priority','status','query'])state[k]=state.filter[k];$('#fd-search').value=state.query;state.collapsed.clear();state.panel='';render();break;
      case 'reset-draft':Object.assign(state.filter,{scope:'all',due:'all',category:'all',source:'all',priority:'all',status:'open',query:''});renderPanel();break;
      case 'clear':state.query='';$('#fd-search').value='';drawRows();renderSide();if(state.panel==='filter'){state.filter.query='';renderPanel()}icons();$('#fd-search').focus();break;
      case 'reset':reset();break;
      case 'refresh':render();tell('Fristenansicht im Entwurf aktualisiert.');break;
      case 'close':case 'back':closePanel();break;
      case 'dismiss':$('#fd-notice').hidden=true;break;
      case 'keep-edit':state.confirm='';renderPanel();break;
      case 'discard':state.dirty=false;closePanel();break;
      case 'save':save();break;
      case 'plus30':if(!state.draft.baseDate){$('.fd-form-error').hidden=false;$('.fd-form-error').textContent='Bitte zuerst ein Bescheiddatum eintragen.';$('[name=baseDate]').focus();break}state.draft.dueDate=shift(state.draft.baseDate,30);state.dirty=true;$('[name=dueDate]').value=state.draft.dueDate;$('.fd-form-error').hidden=true;$('.fd-form-preview').innerHTML=routes(state.draft);icons();break;
      case 'complete':if(!x||x.source==='debt'||x.kind==='derived')break;if(x.status==='done'){x.status='open';tell('Frist im Entwurf wieder geöffnet.')}else{const next=completeFrist(x);tell(next?'Erledigt. Folgefrist für den '+date(next)+' angelegt.':'Frist im Entwurf erledigt.')}render();$('[data-action=complete]')?.focus({preventScroll:true});break;
      case 'delete':state.confirm='delete';renderPanel();$('.fd-confirm')?.scrollIntoView({block:'nearest'});break;
      case 'cancel-delete':state.confirm='';renderPanel();break;
      case 'confirm-delete':if(x&&x.kind!=='derived'&&x.source!=='debt'){items=items.filter(y=>y.id!==x.id);state.panel='';state.selected=null;state.confirm='';render();tell('Frist und verknüpfte Einträge im Entwurf gelöscht.')}break;
      case 'route-cal':case 'route-todo':if(x?.source==='debt'){x.routing=a==='route-cal'?route(!hasCal(x),hasTodo(x)):route(hasCal(x),!hasTodo(x));render();tell('Kalender-/Aufgabenzuordnung im Entwurf geändert.')}break;
      case 'open-case':state.activeCase=x.caseId;render();tell(label(cases,x.caseId)+' ist jetzt der geöffnete Fall im Entwurf.');break;
      case 'adopt':if(x?.kind==='derived'&&x.caseId===state.activeCase){x.kind='own';x.routing='both';x.source='derived';state.source='all';state.status='open';render();tell('Vorschlag als eigene, bearbeitbare Frist übernommen.')}break;
      case 'scan':state.files=[];state.scanResults=[];state.scanStep=0;state.scanCase=['all','self'].includes(state.scope)?state.activeCase:state.scope;openPanel('scan');break;
      case 'pick-files':$('#fd-upload').click();break;
      case 'sample-files':if(!state.files.some(f=>f.name==='Mitwirkungsaufforderung.pdf'))state.files.push({name:'Mitwirkungsaufforderung.pdf'});renderPanel();break;
      case 'analyze':if(!state.scanResults.length)state.scanResults=[{...blank,title:'Unterlagen zur Weiterbewilligung',category:'behoerde',institution:'Jobcenter Musterstadt',baseDate:'2026-09-03',dueDate:'2026-09-24',selected:true,source:'ki',priority:'high',note:'Aktuelle Einkommensnachweise einreichen. Beispielergebnis der Dokumentenerkennung.'}];state.scanStep=1;renderPanel();focusPanel();break;
      case 'scan-back':state.scanStep=0;renderPanel();break;
      case 'import-scan':{const rows=state.scanResults.filter(r=>r.selected);if(!rows.length)break;if(rows.some(r=>!r.title.trim()&&!r.dueDate)){tell('Bitte einen Titel oder ein Datum für die Auswahl angeben.','error');$('[data-scan-field=title]')?.focus();break}rows.forEach((r,i)=>{const id='ocr'+Date.now()+i;items.push({...r,title:r.title.trim()||label(categories,r.category),id,caseId:state.scanCase,routing:'both',status:'open',kind:'own',activity:['Frist aus Dokument übernommen · '+date(today)]});state.importedId=id});state.scanStep=2;render();tell('Erkanntes Beispiel im Entwurf übernommen.');focusPanel();break}
      case 'show-import':state.selected=state.importedId;openPanel('detail');break;
      case 'scan-again':state.files=[];state.scanResults=[];state.scanStep=0;renderPanel();focusPanel();break;
    }
  });
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.panel){e.preventDefault();if(state.confirm){state.confirm='';renderPanel()}else closePanel()}});
  root.addEventListener('dragover',e=>{const d=e.target.closest('.fd-drop');if(d){e.preventDefault();d.classList.add('fd-drag-over')}});
  root.addEventListener('dragleave',e=>e.target.closest('.fd-drop')?.classList.remove('fd-drag-over'));
  root.addEventListener('drop',e=>{if(e.target.closest('.fd-drop')){e.preventDefault();state.files.push(...[...e.dataTransfer.files].map(f=>({name:f.name})));state.scanResults=[];renderPanel()}});
  function applyDesign(){root.style.setProperty('--fd-row-space',design.density==='compact'?'10px':'16px');root.dataset.detail=design.detail;root.style.colorScheme=design.appearance==='auto'?'light dark':design.appearance;root.style.maxWidth=design.width==='phone'?'390px':'';}
  render();applyDesign();
  new ResizeObserver(()=>{$('#fd-search').placeholder=root.clientWidth<=640?'Fristen suchen':'Titel, Institution, Notiz oder Fall suchen'}).observe(root);
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'density',{label:'Listendichte',options:[{label:'Luftig',value:'comfortable'},{label:'Kompakt',value:'compact'}]});tweak.addSelect(design,'detail',{label:'Details',options:[{label:'Seitenbereich',value:'side'},{label:'Eigene Ansicht',value:'full'}]});tweak.addSelect(design,'appearance',{label:'Darstellung',options:[{label:'Automatisch',value:'auto'},{label:'Hell',value:'light'},{label:'Dunkel',value:'dark'}]});tweak.addSelect(design,'width',{label:'Bildschirm',options:[{label:'Verfügbare Breite',value:'auto'},{label:'Smartphone',value:'phone'}]});}
})();
</script>
