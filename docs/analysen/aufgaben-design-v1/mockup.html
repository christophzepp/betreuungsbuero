<script>
(()=>{
 const root=document.getElementById('aufgaben-entwurf'),q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
 const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=(name,cls='')=>`<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
 const button=(label,action,ico='',cls='',attrs='')=>`<button type="button" class="at-button ${cls}" data-action="${action}" ${attrs}>${ico?icon(ico):''}${label}</button>`;
 const ib=(label,action,ico,attrs='')=>`<button type="button" class="at-icon-button" aria-label="${e(label)}" data-action="${action}" ${attrs}>${icon(ico)}</button>`;
 const today='2026-09-09',endWeek='2026-09-13';
 const cases=['Kilic, Emre','Rothenberg, Dieter','Auerbach, Margarete','Nowak, Halina','Weidmann, Jonas'];
 const lists=[{id:'office',name:'Aufgaben Büro',color:'#2c6584',connection:'Vikunja · Büro'},{id:'personal',name:'Persönlich',color:'#538776',connection:'Nextcloud · Büro'},{id:'local',name:'In dieser Software',color:'#6f8394',connection:'In dieser Software'},{id:'followup',name:'Wiedervorlagen',color:'#97713e',connection:'In dieser Software'}];
 const seed=[
 {id:1,title:'Widerspruch gegen Betriebskostenabrechnung 2025',type:'followup',case:cases[0],due:'2026-09-07',start:'2026-09-01',priority:'high',list:'followup',note:'Institution/Gegenüber: Wohnbau Musterbrück GmbH\nKategorie: Widerspruch\n\nNachforderung prüfen und Rückmeldung des Mietervereins einholen. Prüfbericht wegen Fehlern bei der Heizkostenverteilung zur Fallakte nehmen.',source:'Dokument · Widerspruch Betriebskostenabrechnung',files:[{name:'Prüfbericht Mieterverein.pdf',size:248,remote:false}],freq:'',interval:1,until:'',done:false},
 {id:2,title:'Vergütungsantrag für das 3. Quartal vorbereiten',type:'task',case:cases[3],due:'2026-09-07',start:'2026-09-03',priority:'normal',list:'office',note:'Seit dem Erbfall vermögend; Vergütung aus dem Vermögen. Angaben für den Antrag aktualisieren.',files:[],freq:'',interval:1,until:'',done:false},
 {id:3,title:'Stellungnahme zur Teilfreigabe des Sparguthabens',type:'followup',case:cases[2],due:'2026-09-08',start:'',priority:'high',list:'followup',note:'Institution/Gegenüber: Amtsgericht Musterstadt\nKategorie: Stellungnahme\n\nDas Gericht hat um eine ergänzende Begründung und eine Kopie des Vorsorgevertrages gebeten.',source:'Fallakte · Stellungnahme',files:[],freq:'',interval:1,until:'',done:false},
 {id:4,title:'Barbetrag-Abrechnung prüfen',type:'task',case:cases[1],due:today,start:'2026-09-08',priority:'normal',list:'office',note:'Quartalsabrechnung der Wohngruppe prüfen. Belege mit den Auszahlungen abgleichen und offene Rückfragen für den nächsten Besuch notieren.',source:'Wünsche und Bedarfe · Selbstbestimmte Ausgaben',files:[{name:'Abrechnung Wohngruppe.pdf',size:186,remote:true},{name:'Belegübersicht September.xlsx',size:42,remote:true}],freq:'',interval:1,until:'',done:false},
 {id:5,title:'Kontoauszüge an das Jobcenter senden',type:'task',case:cases[0],due:today,start:'2026-09-08',priority:'high',list:'office',note:'Mitwirkung zur Weiterbewilligung. Vollständigkeit der Kontoauszüge prüfen und die Unterlagen anschließend einreichen.',files:[],freq:'',interval:1,until:'',done:false},
 {id:6,title:'Monatlicher Rückruf bei der Wohngruppe',type:'task',case:cases[4],due:today,start:'',priority:'normal',list:'personal',note:'Entwicklung in der Werkstatt und anstehende Termine besprechen. Wünsche von Herrn Weidmann aufnehmen.',files:[],freq:'monthly',interval:1,until:'2026-12-31',done:false},
 {id:7,title:'Nebenkostenabrechnung nachrechnen',type:'task',case:cases[3],due:'2026-09-11',start:'2026-09-10',priority:'normal',list:'office',note:'Die Nachzahlung erscheint zu hoch. Abschläge und Verteilerschlüssel mit dem Vorjahr vergleichen.',files:[],freq:'',interval:1,until:'',done:false},
 {id:8,title:'Kontakt der Wohnberatung aktualisieren',type:'task',case:cases[2],due:'',start:'',priority:'low',list:'local',note:'Neue Ansprechpartnerin und Telefonnummer in den Unterlagen ergänzen.',files:[],freq:'',interval:1,until:'',done:false},
 {id:9,title:'Brillenrechnung zur Erstattung eingereicht',type:'task',case:cases[4],due:'2026-09-08',start:'2026-09-04',priority:'normal',list:'office',note:'Rechnung und Zahlungsnachweis eingereicht.',files:[],freq:'',interval:1,until:'',done:true}
 ];
 let items=structuredClone(seed),s={status:'open',due:'all',priority:'all',case:'all',type:'all',list:'all',search:'',sort:'due',hidden:[],colors:{personal:'#538776',local:'#6f8394',followup:'#97713e'},defaultColor:'#2c6584',panel:null,id:null,draft:null,dirty:false,confirm:null};
 const design={density:'comfortable',grouped:true,mobile:false};
 const names={open:'Offen',done:'Erledigt',all:'Alle',high:'Hoch',normal:'Normal',low:'Niedrig',task:'Aufgabe',followup:'Wiedervorlage'};
 const frequencies={daily:'Täglich',weekly:'Wöchentlich',monthly:'Monatlich',yearly:'Jährlich'};
 const dueNames={all:'Alle Fälligkeiten',overdue:'Überfällig',today:'Heute',week:'Diese Woche',none:'Ohne Termin'};
 const entryCount=n=>n+' '+(n===1?'Eintrag':'Einträge');
 const listName=id=>lists.find(l=>l.id===id)?.name||'In dieser Software';
 const color=id=>s.colors[id]||s.defaultColor;
 const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'Ohne Termin';
 const dueLabel=t=>!t.due?'Ohne Termin':t.due===today?'Heute':t.due==='2026-09-10'?'Morgen':fmt(t.due);
 const overdue=t=>!t.done&&t.due&&t.due<today;
 function filtered(overrides={}){const f={...s,...overrides};return items.filter(t=>{
  if(f.hidden.includes(t.list)||f.case!=='all'&&t.case!==f.case||f.status==='open'&&t.done||f.status==='done'&&!t.done)return false;
  if(f.priority!=='all'&&t.priority!==f.priority||f.type!=='all'&&t.type!==f.type||f.list!=='all'&&t.list!==f.list)return false;
  if(f.due==='overdue'&&!overdue(t)||f.due==='today'&&t.due!==today||f.due==='week'&&(!t.due||t.due<today||t.due>endWeek)||f.due==='none'&&t.due)return false;
  return !f.search||[t.title,t.note,t.case,listName(t.list)].join(' ').toLocaleLowerCase('de').includes(f.search.toLocaleLowerCase('de'));
 })}
 function sorted(){const a=filtered(),rank={high:0,normal:1,low:2};if(s.sort!=='manual')a.sort((a,b)=>Number(a.done)-Number(b.done)||(s.sort==='title'?a.title.localeCompare(b.title,'de'):s.sort==='priority'?rank[a.priority]-rank[b.priority]||String(a.due||'9999').localeCompare(b.due||'9999'):String(a.due||'9999').localeCompare(b.due||'9999')));return a}
 function option(value,label,selected){return `<option value="${e(value)}" ${value===selected?'selected':''}>${e(label)}</option>`}
 function select(label,key,options,value,scope='filter',extra=''){return `<label class="at-field">${label}<span class="at-select-wrap"><select data-${scope}="${key}" ${extra}>${options.map(([v,l])=>option(v,l,value)).join('')}</select>${icon('chevron-down')}</span></label>`}
 function input(label,key,type,value,extra=''){return `<label class="at-field">${label}<input type="${type}" data-field="${key}" value="${e(value)}" ${extra}></label>`}
 function renderFeedback(){
  qa('.at-feedback').forEach(el=>el.remove());if(!s.message)return;
  const box=document.createElement('div');box.className='at-feedback';box.setAttribute('role','status');box.innerHTML=`<span>${e(s.message)}</span>${ib('Meldung schließen','dismiss-message','x')}`;
  const anchor=s.panel?(q('.at-panel-body .at-panel-actions')||q('.at-panel-head')):q('.at-resultbar');anchor?.after(box);icons();
 }
 function announce(message){s.message=message;renderFeedback()}
 function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}})}
 function growNote(){const note=q('[data-field="note"]');if(note){note.style.height='auto';note.style.height=Math.max(96,note.scrollHeight+2)+'px'}}
 function renderSidebar(){q('.at-sidebar').innerHTML=`<section>${select('Fall auswählen','case',[['all','Alle Fälle'],...cases.map(c=>[c,c])],s.case)}<nav class="at-side-nav" aria-label="Fälligkeit">${Object.entries(dueNames).map(([key,label])=>`<button data-action="due" data-value="${key}" aria-pressed="${s.due===key}">${icon({all:'inbox',overdue:'circle-alert',today:'calendar-check',week:'calendar-days',none:'calendar-minus'}[key])}<span>${label}</span><span class="at-count">${filtered({due:key,status:s.status}).length}</span></button>`).join('')}</nav></section><section><h3>Eintragsarten</h3><nav class="at-side-nav" style="margin-top:0">${[['all','Alle Einträge','layers'],['task','Aufgaben','square-check'],['followup','Wiedervorlagen','history']].map(([key,label,ico])=>`<button data-action="type" data-value="${key}" aria-pressed="${s.type===key}">${icon(ico)}${label}</button>`).join('')}</nav></section><section><h3>Meine Listen</h3>${lists.map(l=>`<label class="at-side-check"><input type="checkbox" data-visibility="${l.id}" ${!s.hidden.includes(l.id)?'checked':''}><span class="at-dot" style="background:${color(l.id)}"></span>${l.name}</label>`).join('')}${button('Listen & Farben','lists','palette')}</section>`}
 function renderList(){
  q('.at-status').innerHTML=['open','done','all'].map(v=>`<button data-action="status" data-value="${v}" aria-pressed="${s.status===v}">${names[v]} <span class="at-count">${filtered({status:v}).length}</span></button>`).join('');
  q('#at-sort').value=s.sort;let chips=[];
  for(const [key,label] of [['case',s.case],['due',dueNames[s.due]],['priority',names[s.priority]],['type',names[s.type]],['list',listName(s.list)]])if(s[key]!=='all')chips.push(`<button class="at-chip" data-action="clear-filter" data-key="${key}">${e(label)} ${icon('x')}</button>`);
  if(s.hidden.length)chips.push(`<button class="at-chip" data-action="lists">${s.hidden.length} ${s.hidden.length===1?'Liste ausgeblendet':'Listen ausgeblendet'} ${icon('settings-2')}</button>`);
  q('.at-active-filters').innerHTML=chips.join('');q('#at-filter-count').hidden=!chips.length;q('#at-filter-count').textContent=chips.length;
  const visible=sorted();q('#at-result-count').textContent=`${visible.length} ${visible.length===1?'Eintrag':'Einträge'}`;let last='',html='';
  visible.forEach((t,i)=>{
   const group=t.done?'Erledigt':overdue(t)?'Überfällig':t.due===today?'Heute':t.due?'Anstehend':'Ohne Termin';
   if(design.grouped&&s.sort==='due'&&group!==last){html+=`<div class="at-group ${group==='Überfällig'?'at-overdue':''}">${group}<span class="at-count">${visible.filter(x=>(x.done?'Erledigt':overdue(x)?'Überfällig':x.due===today?'Heute':x.due?'Anstehend':'Ohne Termin')===group).length}</span></div>`;last=group}
   html+=`<article class="at-row ${t.done?'at-done':''} ${s.id===t.id?'at-selected':''}" data-id="${t.id}" ${s.sort==='manual'?'draggable="true"':''}><label class="at-checkbox"><input type="checkbox" data-complete="${t.id}" ${t.done?'checked':''} aria-label="${e(t.title)} ${t.done?'wieder öffnen':'erledigen'}"></label><button class="at-open-row" data-action="detail" data-id="${t.id}" aria-label="Details: ${e(t.title)}"><span class="at-row-title"><span class="at-type-icon ${t.type==='followup'?'at-followup':''}">${icon(t.type==='followup'?'history':'square-check')}</span><span class="at-title-text">${e(t.title)}</span></span><span class="at-context"><span class="at-case">${e(t.case||'Ohne Fall')}</span><span>·</span><span><span class="at-dot" style="background:${color(t.list)}"></span>${e(listName(t.list))}</span></span>${t.note?`<span class="at-excerpt">${e(t.note.replace(/\n/g,' '))}</span>`:''}<span class="at-meta"><span class="at-due ${overdue(t)?'at-overdue':t.due===today?'at-today':''}">${icon(overdue(t)?'circle-alert':'calendar-days')}${dueLabel(t)}</span><span class="at-priority-${t.priority}">${icon('flag')}${names[t.priority]}</span>${t.freq?`<span>${icon('repeat')}Serie</span>`:''}${t.files.length?`<span>${icon('paperclip')}${t.files.length}</span>`:''}${t.type==='followup'?'<span>Wiedervorlage</span>':''}</span></button><div class="at-row-end">${s.sort==='manual'?`<div class="at-moves">${ib('Nach oben','move-up','chevron-up',`data-id="${t.id}" ${i===0?'disabled':''}`)}${ib('Nach unten','move-down','chevron-down',`data-id="${t.id}" ${i===visible.length-1?'disabled':''}`)}</div>`:''}${ib('Aktionen: '+t.title,'detail','chevron-right',`data-id="${t.id}"`)}</div></article>`;
  });q('.at-rows').innerHTML=html||`<div class="at-empty">${icon('list-filter')}<p>Keine passenden Einträge.</p>${button('Filter zurücksetzen','reset','rotate-ccw')}</div>`;
 }
 function panelHead(title,subtitle='',extra=''){return `<div class="at-panel-head">${panelTrail.length?ib('Zurück','close','arrow-left'):''}<div><h2>${title}</h2>${subtitle?`<small>${subtitle}</small>`:''}</div>${extra}${panelTrail.length?'':ib('Bereich schließen','close','x')}</div>`}
 function recurrence(t){return t.freq?`${Number(t.interval)===1?frequencies[t.freq]:'Alle '+t.interval+' '+({daily:'Tage',weekly:'Wochen',monthly:'Monate',yearly:'Jahre'})[t.freq]}${t.until?' · bis '+fmt(t.until):''}`:'Keine Wiederholung'}
 function filesHTML(t,edit=false){return t.files.length?t.files.map((f,i)=>`<div class="at-file">${icon('file-text')}<div>${e(f.name)}<small>${f.size} KB${f.pending?' · Ausstehend':''}</small></div><span class="at-file-actions">${!f.pending?ib('Herunterladen: '+f.name,'download-file','download',`data-index="${i}"`):''}${edit?`${f.remote?ib('An verknüpfte Aufgabe übertragen','send-file','external-link',`data-index="${i}"`):''}${ib('Anlage entfernen: '+f.name,'remove-file','x',`data-index="${i}"`)}`:''}</span></div>`).join(''):'<p class="at-hint">Keine Anlagen hinterlegt.</p>'}
 function detailPanel(t){const index=sorted().findIndex(x=>x.id===t.id);return panelHead(names[t.type],`${listName(t.list)}${index>=0?' · '+(index+1)+' von '+sorted().length:''}`,`${ib('Vorheriger Eintrag','prev','chevron-left',index<=0?'disabled':'')}${ib('Nächster Eintrag','next','chevron-right',index<0||index>=sorted().length-1?'disabled':'')}`)+`<div class="at-panel-body"><span class="at-chip">${icon(t.done?'circle-check':t.type==='followup'?'history':'square-check')}${t.done?'Erledigt':names[t.type]+' · Offen'}</span><h2>${e(t.title)}</h2><dl class="at-detail-meta">${[['user-round','Fall',t.case||'Ohne Fall'],['flag','Priorität',names[t.priority]],['calendar-days','Fällig am',fmt(t.due)],['calendar-clock','Bearbeitungsstart',t.start?fmt(t.start):'Nicht festgelegt'],['list-todo','Aufgabenliste',listName(t.list)],['repeat','Wiederholung',recurrence(t)]].map(([ico,k,v])=>`<div><dt>${icon(ico)}${k}</dt><dd>${e(v)}</dd></div>`).join('')}</dl><section><h3>Notiz</h3><p class="at-note">${e(t.note||'Keine Notiz hinterlegt.')}</p>${t.source?`<div class="at-source">${icon('link')}<span>Quelle: ${e(t.source)}</span></div>`:''}</section><section><h3>Anlagen · ${t.files.length}</h3>${filesHTML(t)}</section>${t.freq&&!t.done?'<div class="at-message">Beim Erledigen rückt diese Serienaufgabe auf die nächste Fälligkeit vor.</div>':''}<div class="at-panel-actions">${button(t.done?'Wieder öffnen':'Erledigen','complete',t.done?'rotate-ccw':'check','at-primary')}${button('Bearbeiten','edit','pencil')}</div><div class="at-panel-actions" style="margin-top:9px;padding-top:9px;border:0">${button('Als ICS exportieren','export-single','download','at-quiet')}${button('Löschen','delete','trash-2','at-quiet at-danger')}</div>${s.confirm==='delete'?`<div class="at-inline-confirm">Diesen Eintrag wirklich löschen?<div class="at-panel-actions">${button('Abbrechen','cancel-delete')}${button('Eintrag löschen','confirm-delete','trash-2','at-danger')}</div></div>`:''}</div>`}
 function editPanel(){const t=s.draft,locked=!!t.id&&t.list!=='local'&&t.list!=='followup';return panelHead(t.id?names[t.type]+' bearbeiten':'Neue Aufgabe','Noch nicht gespeichert')+`<form class="at-panel-body at-form" id="at-editor"><section><h3>${names[t.type]}</h3><div class="at-field-grid"><div class="at-wide">${input('Titel','title','text',t.title,'required aria-label="Titel"')}</div>${select('Fall','case',[['','Ohne Fall'],...cases.map(c=>[c,c])],t.case,'field')}${select('Priorität','priority',[['normal','Normal'],['high','Hoch'],['low','Niedrig']],t.priority,'field')}</div></section><section><h3>Termin & Wiederholung</h3><div class="at-field-grid">${input('Bearbeitungsstart','start','date',t.start)}${input('Fällig am','due','date',t.due)}<div class="at-wide">${select('Wiederholung','freq',[['','Keine'],...Object.entries(frequencies)],t.freq,'field')}</div><div class="at-recur-fields at-wide" ${!t.freq?'hidden':''}><div class="at-field-grid">${input('Intervall','interval','number',t.interval,'min="1"')}${input('Enddatum (optional)','until','date',t.until)}</div><p class="at-hint" id="at-recur-hint">${e(recurrence(t))}</p></div></div></section><section><h3>Zuordnung</h3><div class="at-field-grid"><div class="at-wide">${select('Speicherort','connection',[['local','In dieser Software'],['vikunja','Vikunja · Büro'],['nextcloud','Nextcloud · Büro']],t.connection,'field',locked?'disabled':'')}</div><div class="at-wide">${select('Aufgabenliste','list',listOptions(t.connection,t.type),t.list,'field',locked?'disabled':'')}</div></div>${locked?'<p class="at-hint">Die bestehende externe Liste bleibt erhalten. Für eine andere Liste eine neue Aufgabe anlegen.</p>':''}${t.source?`<div class="at-source">${icon('link')}<span>${e(t.source)}</span></div>`:''}</section><section><h3>Notiz</h3><label class="at-field"><textarea data-field="note" aria-label="Notiz" rows="4">${e(t.note)}</textarea></label></section><section><h3>Anlagen</h3><div id="at-form-files">${filesHTML(t,true)}  function toolsPanel(){return panelHead('Werkzeuge','Aufgaben verwalten')+`<div class="at-panel-body"><section><h3>Austausch</h3><div class="at-action-list"><label class="at-button at-upload">${icon('upload')}ICS importieren<input type="file" class="at-file-input" aria-label="ICS importieren" accept=".ics" id="at-import"></label>${button('Aufgaben als ICS exportieren','export-all','download')}</div><p class="at-hint">Exportiert alle Aufgaben des gewählten Falls, einschließlich erledigter und ausgeblendeter Aufgaben. Wiedervorlagen lassen sich einzeln exportieren.</p><p class="at-hint">Fallfilter: ${e(s.case==='all'?'Alle Fälle':s.case)}</p></section><section><h3>Verbundene Listen</h3><div class="at-action-list">${button('Aufgaben synchronisieren','sync','refresh-cw')}${button('Listen & Farben','lists','palette')}</div><p class="at-hint">Vikunja · Büro / Nextcloud · Büro</p></section></div>`}
 function renderPanel(){const panel=q('.at-panel');panel.hidden=!s.panel;q('.at-layout').classList.toggle('at-has-panel',!!s.panel);if(!s.panel){panel.innerHTML='';return}const t=items.find(x=>x.id===s.id);panel.innerHTML=s.panel==='detail'&&t?detailPanel(t):s.panel==='edit'?editPanel():s.panel==='filter'?filterPanel():s.panel==='lists'?listsPanel():toolsPanel();icons();growNote();renderFeedback()}

 function nextDue(t){if(!t.freq||!t.due)return '';const d=new Date(t.due+'T12:00:00'),n=Number(t.interval)||1;if(t.freq==='daily')d.setDate(d.getDate()+n);if(t.freq==='weekly')d.setDate(d.getDate()+7*n);if(t.freq==='monthly'){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}if(t.freq==='yearly'){const month=d.getMonth();d.setFullYear(d.getFullYear()+n);if(d.getMonth()!==month)d.setDate(0)}const out=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return t.until&&out>t.until?'':out}
 function complete(id){const t=items.find(x=>x.id===id);if(!t)return;const due=!t.done?nextDue(t):'';if(due){t.due=due;announce('Serienaufgabe erledigt. Nächste Fälligkeit: '+fmt(due))}else{t.done=!t.done;announce(t.done?'Eintrag erledigt.':'Eintrag wieder geöffnet.')}render()}

 function exportItems(tasks){const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Betreuungsbuero//Aufgaben Entwurf//DE',...tasks.flatMap(t=>['BEGIN:VTODO','UID:mock-'+t.id,'SUMMARY:'+icsEscape(t.title),'DESCRIPTION:'+icsEscape(t.note),'STATUS:'+(t.done?'COMPLETED':'NEEDS-ACTION'),'PRIORITY:'+({high:1,normal:5,low:9})[t.priority],...(t.start?['DTSTART;VALUE=DATE:'+t.start.replace(/-/g,'')]:[]),...(t.due?['DUE;VALUE=DATE:'+t.due.replace(/-/g,'')]:[]),...(t.freq?['RRULE:FREQ='+t.freq.toUpperCase()+';INTERVAL='+t.interval+(t.until?';UNTIL='+t.until.replace(/-/g,''):'')]:[]),'END:VTODO']),'END:VCALENDAR'].join('\r\n');download('Aufgaben-Entwurf.ics',content);announce('ICS-Export mit '+tasks.length+' Einträgen aus den Beispieldaten vorbereitet.')}

 root.addEventListener('input',ev=>{

 root.addEventListener('change',async ev=>{

  if(el.id==='at-import'&&el.files[0]){try{const text=await el.files[0].text();const components=text.replace(/\r?\n[ \t]/g,'').match(/BEGIN:VTODO[\s\S]*?END:VTODO/g)||[];let count=0;for(const component of components){const prop=k=>component.match(new RegExp('^'+k+'(?:;[^:]*)?:(.*)$','m'))?.[1]?.trim()||'';const title=prop('SUMMARY').replace(/\\n/g,'\n').replace(/\\([,;\\])/g,'$1');if(!title)continue;const date=k=>{const x=prop(k).slice(0,8);return /^\d{8}$/.test(x)?x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6):''};const rule=Object.fromEntries(prop('RRULE').split(';').filter(Boolean).map(x=>x.split('=')));items.push({id:Math.max(...items.map(t=>t.id),0)+1,title,type:'task',case:s.case==='all'?'':s.case,note:prop('DESCRIPTION').replace(/\\n/g,'\n'),due:date('DUE'),start:date('DTSTART'),priority:Number(prop('PRIORITY'))<5&&Number(prop('PRIORITY'))>0?'high':Number(prop('PRIORITY'))>5?'low':'normal',list:'local',files:[],freq:rule.FREQ?.toLowerCase()||'',interval:Number(rule.INTERVAL)||1,until:rule.UNTIL?rule.UNTIL.slice(0,4)+'-'+rule.UNTIL.slice(4,6)+'-'+rule.UNTIL.slice(6,8):'',done:prop('STATUS')==='COMPLETED'});count++}closePanel();announce(count?count+' Aufgaben in die Vorschau importiert.':'Keine Aufgaben in dieser ICS-Datei gefunden.')}catch{announce('Die ICS-Datei konnte nicht gelesen werden.')}}

 function save(){if(!q('#at-editor').reportValidity())return;const t=s.draft,error=q('#at-form-error');if(!t.title.trim()||t.start&&t.due&&t.due<t.start||t.freq&&t.until&&t.due&&t.until<t.due){error.hidden=false;error.textContent=!t.title.trim()?'Bitte einen Titel angeben.':t.start&&t.due<t.start?'Die Fälligkeit darf nicht vor dem Bearbeitungsstart liegen.':'Das Serienende darf nicht vor der ersten Fälligkeit liegen.';return}t.title=t.title.trim();t.files.forEach(f=>f.pending=false);if(t.id)items[items.findIndex(x=>x.id===t.id)]=structuredClone(t);else{t.id=Math.max(...items.map(x=>x.id),0)+1;items.push(structuredClone(t))}s.id=t.id;s.panel='detail';s.dirty=false;panelTrail=[];render();revealPanel();announce('Aufgabe in der Vorschau gespeichert.')}

  if(a==='move-up'||a==='move-down'){move(id,a==='move-up'?-1:1);return}
  if(a==='explorer'){q('#at-explorer').hidden=false;return}if(a==='close-explorer'){q('#at-explorer').hidden=true;return}if(a==='pick-file'){addFile('Besuchsnotiz September.pdf',94);q('#at-explorer').hidden=true;return}
  if(a==='remove-file'){const i=Number(el.dataset.index),host=q('#at-confirm-host');host.innerHTML=`<div class="at-inline-confirm">Anlage „${e(s.draft.files[i].name)}“ entfernen?<div class="at-panel-actions">${button('Abbrechen','cancel-file')}${button('Entfernen','confirm-file','trash-2','at-danger',`data-index="${i}"`)}</div></div>`;icons();return}
  if(a==='cancel-file'){q('#at-confirm-host').innerHTML='';return}if(a==='confirm-file'){s.draft.files.splice(Number(el.dataset.index),1);s.dirty=true;q('#at-confirm-host').innerHTML='';refreshFiles();return}
  if(a==='send-file'){announce('Vorschau: Anlage zur verknüpften Vikunja-/OpenProject-Aufgabe übertragen.');return}
  if(a==='download-file'){const t=s.panel==='edit'?s.draft:items.find(x=>x.id===s.id);announce('Vorschau des Downloads: '+t.files[Number(el.dataset.index)].name);return}
  if(a==='export-single'){exportItems([items.find(x=>x.id===s.id)]);return}
  if(a==='export-all'){const arr=items.filter(t=>t.type==='task'&&(s.case==='all'||t.case===s.case));if(arr.length)exportItems(arr);else announce('Keine Aufgaben im gewählten Fall vorhanden.');return}
  if(a==='sync'){el.disabled=true;el.textContent='Wird synchronisiert …';setTimeout(()=>{q('#at-sync-status').textContent='Vorschau: soeben synchronisiert';announce('Vorschau: Aufgabenlisten sind aktuell.');if(s.panel==='tools')renderPanel()},600);return}
 });
 let dragged=null;
 root.addEventListener('dragstart',ev=>{const row=ev.target.closest('.at-row[draggable]');if(!row)return;dragged=Number(row.dataset.id);ev.dataTransfer.setData('text/plain',String(dragged));ev.dataTransfer.effectAllowed='move'});
 root.addEventListener('dragover',ev=>{const row=ev.target.closest('.at-row[draggable]');if(!row||dragged===null||Number(row.dataset.id)===dragged)return;ev.preventDefault();qa('.at-drop').forEach(x=>x.classList.remove('at-drop','at-drop-after'));const box=row.getBoundingClientRect();row.classList.add('at-drop');row.classList.toggle('at-drop-after',ev.clientY>box.top+box.height/2)});
 root.addEventListener('drop',ev=>{const row=ev.target.closest('.at-row[draggable]');if(!row||dragged===null)return;ev.preventDefault();const ids=sorted().map(t=>t.id),target=Number(row.dataset.id);if(ids.includes(dragged)&&ids.includes(target)&&dragged!==target){ids.splice(ids.indexOf(dragged),1);ids.splice(ids.indexOf(target)+(row.classList.contains('at-drop-after')?1:0),0,dragged);const ordered=ids.map(id=>items.find(t=>t.id===id));let i=0;items=items.map(t=>ids.includes(t.id)?ordered[i++]:t);render();announce('Manuelle Reihenfolge geändert.')}dragged=null;qa('.at-drop').forEach(x=>x.classList.remove('at-drop','at-drop-after'))});
 root.addEventListener('dragend',()=>{dragged=null;qa('.at-drop').forEach(x=>x.classList.remove('at-drop','at-drop-after'))});
 root.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&s.panel==='edit'&&ev.target.matches('input[type=text],input[type=number]')){ev.preventDefault();save();return}if(ev.key==='Escape'&&s.panel){ev.preventDefault();if(pending){pending=null;q('#at-confirm-host').innerHTML='';q('[data-field=title]').focus({preventScroll:true})}else leave(backPanel)}});
 q('[data-action="new"]').setAttribute('aria-label','Neue Aufgabe');q('[data-action="filter"]').setAttribute('aria-label','Filter');q('[data-action="tools"]').setAttribute('aria-label','Werkzeuge');
 render();
 let lastWidth=0;const resize=new ResizeObserver(()=>{const width=root.getBoundingClientRect().width;if(width===lastWidth)return;lastWidth=width;q('#at-search').placeholder=width<=460?'Aufgaben durchsuchen':'Titel, Notiz, Fall oder Liste suchen';growNote()});resize.observe(root);
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Listendichte',options:[{label:'Komfortabel',value:'comfortable'},{label:'Kompakt',value:'compact'}]});tweak.addToggle(design,'grouped',{label:'Nach Fälligkeit gruppieren'});tweak.addToggle(design,'mobile',{label:'Mobile Vorschau'})}
})();
